name: pixi

on:
  push:
    branches:
      - main
    paths:
          - 'fiatlux_interfaces/**'
          - 'fiatlux_utils/**'
          - 'pixi.toml'
          - 'pixi.lock'
          - '!**/*.md'
  pull_request:
    paths:
          - 'fiatlux_interfaces/**'
          - 'fiatlux_utils/**'
          - 'pixi.toml'
          - 'pixi.lock'
          - '!**/*.md'
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  pixi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: prefix-dev/setup-pixi@v0.9.2
        with:
          pixi-version: v0.63.2
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
          activate-environment: true
      # only do isort check as black check is already done by other workflows
      - name: style
        run: |
          isort -c fiatlux_utils/fiatlux_teleoperation
      - name: type checks
        run: |
          pyright
